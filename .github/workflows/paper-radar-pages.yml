name: Publish Paper Radar
on:
  push:
    branches: [master]
    paths:
      - 'paper-radar/**'
      - '.github/workflows/paper-radar-pages.yml'
  pull_request:
    paths:
      - 'paper-radar/**'
      - '.github/workflows/paper-radar-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: paper-radar-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r paper-radar/site/requirements.txt
      - run: python paper-radar/scripts/build_site.py
      - run: python paper-radar/scripts/check_site.py _site
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

